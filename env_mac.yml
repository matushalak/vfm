name: vfm
channels:
  - conda-forge
dependencies:
  # ---- core runtime ----
  - python=3.11
  - pip
  - setuptools
  - wheel

  # ---- numeric stack (pinned to avoid common ABI/wheel conflicts) ----
  - numpy>=1.26,<2.0
  - scipy>=1.11,<1.13
  - pandas>=2.1
  - scikit-learn>=1.3
  - statsmodels>=0.14

  # ---- general utilities ----
  - pyyaml
  - tqdm
  - joblib
  - rich
  - typing-extensions
  - h5py
  - numba

  # ---- plotting / notebooks ----
  - matplotlib>=3.8
  - seaborn>=0.13
  - plotly>=5.18
  - ipython
  - ipykernel
  - jupyterlab
  - ipywidgets

  # ---- molecule + structure tooling (discrete + 3D) ----
  - rdkit>=2024.03
  - openbabel>=3.1
  - networkx>=3.2

  # ---- pip-installed ML stack (torch + pyg pinned & matched) ----
  - pip:
      # ---- PyTorch w/ Apple Metal (MPS) support ----
      - torch==2.4.0
      - torchvision==0.19.0
      - torchaudio==2.4.0

      # ---- PyG compiled wheels matched to torch==2.4.0 (CPU wheels are correct for macOS/MPS) ----
      # Equivalent to: pip install ... -f https://data.pyg.org/whl/torch-2.4.0+cpu.html
      - --find-links https://data.pyg.org/whl/torch-2.4.0+cpu.html
      - pyg_lib
      - torch_scatter
      - torch_sparse
      - torch_cluster
      - torch_spline_conv
      - torch_geometric==2.7.0

      # ---- training / configs / logging ----
      - lightning>=2.4
      - torchmetrics>=1.4
      - tensorboard>=2.17
      - hydra-core>=1.3
      - omegaconf>=2.3
      - wandb>=0.17

      # ---- transformer + EGNN/VFM convenience libs ----
      - einops>=0.8
      - torchdiffeq>=0.2.4
      - torchsde>=0.2.6

      # ---- 3D visualization helpers ----
      - py3Dmol>=2.4
      - nglview>=3.1